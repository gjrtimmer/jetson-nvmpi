# yaml-language-server: $schema=https://gitlab.com/gitlab-org/gitlab/-/raw/master/app/assets/javascripts/editor/schema/ci.json
#
# CI pipeline for jetson-nvmpi (libnvmpi, the Jetson V4L2/NvBuffer wrapper).
#
# Builder/runtime images are built and published by timmertech/jetson-builder;
# this project only consumes them, pinned to immutable <tag>-<sha8> tags (see
# JETSON_BUILDER_SHA). Same runners, rules and conventions as jetson-ffmpeg.
#
# Three kinds of pipeline:
#
#   Branch / MR pipelines (deduplicated — see workflow:rules):
#     build   - compile libnvmpi (stubs) + unit tests, JP6 and JP5
#     test    - test:api:hw (test_api built by build:jp6) on the Jetson runner,
#               plus additive mock-driver jobs in plain containers (stub on
#               jp6/jp5, ASan+UBSan, TSan). All start in parallel; a failure
#               cancels the rest (workflow:auto_cancel).
#
#   Default-branch (main) pipelines: build, then dist (version <ver>-<sha>,
#     no tag gate) and publish (upload:s3 -> snapshots/<sha>/). The merge
#     method is fast-forward, so main HEAD is the exact commit the MR pipeline
#     already tested on the Jetson: test:api:hw is skipped on main pushes (it
#     still runs on MR, tag, schedule and web pipelines).
#
#   Docs-only changes: branch pipelines are skipped when no code path changed
#     (see .code-paths); an MR always gets a pipeline (ci:docs-only) so the
#     merge gate has something to pass.
#
#   Tag pipelines (v<X.Y.Z>): build + the full hardware soak run too, so a
#   release only happens after the Jetson test passed on that exact commit.
#     release-test - release:test:api:hw, HW_TIER=full soak on the Orin
#               (real hardware only, the mock job is not part of the gate;
#               replaces test:api:hw and the mock jobs on tags). A failure
#               fails the pipeline: no dist, no upload, no release.
#     dist    - build REAL libnvmpi against NVIDIA's apt repo libs, package it
#               (tags: needs release:test:api:hw, NOT optional; main
#               snapshots need test:api:hw optional so they run without it;
#               dist:jp5 also build:jp5)
#     test-deb - test:deb:jp6/jp5 install the dist debs on a clean ubuntu +
#               NVIDIA apt repo and check they load/link (scripts/test-deb.sh);
#               upload:s3 and both release jobs need them. dist + test-deb also
#               run on MRs that touch packaging paths (.pkg-paths) and on main.
#               Tags also run release:test:deb:hw (scripts/test-deb-hw.sh): the
#               installed JP6 debs + test_api built via pkg-config, on the
#               Orin; upload:s3 and both release jobs need it too (tags only).
#     publish - upload:s3 -> S3 releases/<ver>/ + changelog (git-cliff)
#     release - release:gitlab (generic package registry + GitLab Release) and
#               release:github (GitHub Release + assets), independent jobs
#
#   Downstream (manual until split Step 2):
#     trigger:jetson-ffmpeg - starts the jetson-ffmpeg pipeline (NVMPI_REF)
#
# HW_TIER (hardware test depth, a pipeline variable; see workflow:rules):
#   fast - default: short create/close loops (decoder 5 / encoder 10)
#   full - soak: NVMPI_TEST_ITER=50 unless NVMPI_TEST_ITER is set explicitly
#          (the weekly schedule sets NVMPI_TEST_ITER=50 itself)
# Tag pipelines force full; web/schedule/api runs may choose it.
#
# Runner tag convention: only the hw jobs (test:api:hw, release:test:*:hw) need
# real hardware (jetson + orin-nx);
# everything else has NO tags (any runner, K3s). release runs in the release-tools image.

stages:
  - build
  - test
  - release-test
  - dist
  - test-deb
  - publish
  - release
  - downstream

# Pipeline deduplication: when a branch has an open MR, only the MR
# pipeline runs — the branch pipeline is suppressed. Tag pipelines always run.
#
# Docs-only skip: `changes:` has no negation, so the code paths are listed
# positively. A NEW top-level code directory MUST be added to every
# `paths:` list below (workflow:rules x2 and .code-changes) or changes in it
# will not trigger a pipeline.
workflow:
  # A failing stub/sanitizer job cancels the queued Jetson job (and the rest
  # of the pipeline) instead of letting it burn the shared Orin.
  auto_cancel:
    on_job_failure: all
  rules:
    - if: '$CI_COMMIT_TAG'
      variables:
        HW_TIER: "full"
    - if: '$CI_PIPELINE_SOURCE =~ /^(schedule|web|pipeline|api|trigger)$/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        paths: &code-paths
          - src/**/*
          - include/**/*
          - stubs/**/*
          - mock/**/*
          - cmake/**/*
          - vendor/**/*
          - scripts/**/*
          - packaging/**/*
          - test/**/*
          - CMakeLists.txt
          - nvmpi.pc.in
          - cliff.toml
          - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH'
      changes:
        paths: *code-paths
        compare_to: 'refs/heads/main'

variables:
  HW_TIER:
    value: "fast"
    description: "Hardware test depth: fast = short create/close loops, full = NVMPI_TEST_ITER=50 soak (tags always run full)"
    options:
      - "fast"
      - "full"
  L4T_TAG: "r36.4.0"
  L4T_SOC: "t234"
  L4T_TAG_JP5: "r35.4.1"
  NVMPI_PREFIX: "${CI_PROJECT_DIR}/_nvmpi"
  # Images are built by timmertech/jetson-builder. Immutable tags are
  # <tag>-<sha8> of the jetson-builder commit that built them; bump
  # JETSON_BUILDER_SHA to adopt new images (cached by if-not-present).
  JETSON_BUILDER_SHA: "ffd27ba0"
  BUILDER_IMAGE: "harbor.local/jetson/jetson-ffmpeg-builder:${L4T_TAG}-${JETSON_BUILDER_SHA}"
  BUILDER_IMAGE_JP5: "harbor.local/jetson/jetson-ffmpeg-builder-jp5:${L4T_TAG_JP5}-${JETSON_BUILDER_SHA}"
  RUNTIME_IMAGE: "harbor.local/jetson/l4t-jetpack6:${L4T_TAG}-${JETSON_BUILDER_SHA}"
  RELEASE_IMAGE: "harbor.local/jetson/jetson-ffmpeg-release-tools:latest-${JETSON_BUILDER_SHA}"

# Reusable pipeline rules (build/test jobs run on tags too, so a release is
# gated on the Jetson test of that exact commit):
#   .only-tag   — release work; runs only on v<X.Y.Z> tags
#   .tag-or-main — dist/publish: release tags and default-branch pipelines
#                  (not MRs, not other branches)
.only-tag: &only-tag
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
.tag-or-main: &tag-or-main
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event"'

# build/test jobs: MR pipelines run them only when a code path changed
# (docs-only MRs get ci:docs-only instead); every other pipeline runs them.
.code-changes: &code-changes
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        paths: *code-paths
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - when: on_success

default:
  image:
    name: "${BUILDER_IMAGE}"
    pull_policy: if-not-present

# Keeps docs-only MR pipelines non-empty so the merge gate (pipeline must
# succeed) passes. Runs on every MR; code MRs run it beside the real jobs.
ci:docs-only:
  stage: build
  needs: []
  script:
    - echo "MR pipeline ok (build/test run only when a code path changed)"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ---------------------------------------------------------------------------
# Stage: build — libnvmpi against stubs (compile check, NOT runnable) + the
# unit tests (test/unit). The API test needs real libs and runs in test:api.
# JP5 (kernel 5.10) catches V4L2 header constants/symbols that exist on JP6
# (kernel 5.15+) but not JP5; it covers all JP5 releases (5.0.2-5.1.6).
# ---------------------------------------------------------------------------
# ccache: launcher active when the builder image ships ccache; cache is per
# job (build:jp6 / build:jp5 differ), content-hashed compiler check because
# the image is rebuilt.
.build: &build
  stage: build
  <<: *code-changes
  variables:
    CCACHE_DIR: "${CI_PROJECT_DIR}/.ccache"
    CCACHE_COMPILERCHECK: "content"
    CCACHE_MAXSIZE: "200M"
    CCACHE_COMPRESS: "1"
  cache:
    key: "ccache-${CI_JOB_NAME_SLUG}"
    paths:
      - .ccache
  script:
    - |
      if command -v ccache >/dev/null; then
        export CMAKE_C_COMPILER_LAUNCHER=ccache CMAKE_CXX_COMPILER_LAUNCHER=ccache
        ccache -z
      fi
    - bash ./scripts/build.sh --stubs --clean --prefix "${NVMPI_PREFIX}" -j"$(nproc)"
    - (cd build && ctest -R bufpool --output-on-failure)
    - cmake --install build
    - '! command -v ccache >/dev/null || ccache -s'
  artifacts:
    paths:
      - _nvmpi/
      - build/
    expire_in: 1 hour

build:jp6:
  <<: *build

build:jp5:
  <<: *build
  image:
    name: "${BUILDER_IMAGE_JP5}"
    pull_policy: if-not-present

# ---------------------------------------------------------------------------
# Shared apt setup: install the REAL tegra userspace libs (libnvv4l2,
# libnvjpeg, libnvbufsurface, libnvbufsurftransform) from NVIDIA's jetson apt
# repo inside a plain container; the touch file skips nvidia-l4t-core's
# "must run on an NVIDIA Tegra platform" preinstall check.
# ---------------------------------------------------------------------------
.real-libs: &real-libs
  - mkdir -p /opt/nvidia/l4t-packages && touch /opt/nvidia/l4t-packages/.nv-l4t-disable-boot-fw-update-in-preinstall
  - |
    if ! grep -rqs "repo.download.nvidia.com/jetson/${L4T_SOC}" /etc/apt/sources.list /etc/apt/sources.list.d/; then
      wget -qO /etc/apt/trusted.gpg.d/jetson-ota-public.asc https://repo.download.nvidia.com/jetson/jetson-ota-public.asc
      echo "deb https://repo.download.nvidia.com/jetson/${L4T_SOC} ${L4T_TAG%.*} main" > /etc/apt/sources.list.d/nvidia-l4t-${L4T_SOC}.list
    fi
  - apt-get update -qq
  - >-
    apt-get install -y -qq --no-install-recommends
    nvidia-l4t-multimedia nvidia-l4t-multimedia-utils
  - ldconfig

# ---------------------------------------------------------------------------
# Stage: test — libnvmpi public API smoke test (test/api) on real Jetson
# hardware. Runs the test_api binary built by build:jp6 (build/, stub-linked)
# directly: stubs carry the real sonames, so the NVIDIA runtime's injected
# tegra libs satisfy them at load time. NO apt and NO rebuild here: the
# runtime bind-mounts the host tegra libs into the container, so apt cannot
# overwrite them (dpkg "Invalid cross-device link" on nvidia-l4t-core).
# Same image/env as jetson-ffmpeg's hw-test jobs. The image has no ctest, so
# the binary runs directly. Serialized via resource_group.
# ---------------------------------------------------------------------------
test:api:hw:
  stage: test
  image:
    name: "${RUNTIME_IMAGE}"
    pull_policy: if-not-present
  needs: ["build:jp6"]
  # Not on default-branch pushes: with merge_method ff main HEAD is the commit
  # the MR pipeline already tested on the Orin. Schedule/web/MR still run.
  # Not on tags: release:test:api:hw (extends this job) replaces it there.
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        paths: *code-paths
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - when: on_success
  tags: [jetson, orin-nx]
  resource_group: jetson
  timeout: 10m
  variables:
    NVIDIA_VISIBLE_DEVICES: "all"
    NVIDIA_DRIVER_CAPABILITIES: "all"
    # Crashes must fail the job on real hardware, and the child's abort
    # message must be visible (see test/api/test_api.c).
    NVMPI_TEST_STRICT: "1"
    NVMPI_TEST_VERBOSE: "1"
    # Rapid create/close loops default to 5 (decoder) / 10 (encoder); the weekly
    # schedule sets NVMPI_TEST_ITER (schedule variable) for the long soak.
  before_script: []
  script:
    # HW_TIER=full means the 50-iteration soak unless NVMPI_TEST_ITER is set.
    - if [ "${HW_TIER:-fast}" = "full" ] && [ -z "${NVMPI_TEST_ITER:-}" ]; then export NVMPI_TEST_ITER=50; fi
    # Read-only diagnostics: which libs the runtime injected, which device
    # nodes exist, and where the stub-linked binary resolves libnv* from.
    - ls /usr/lib/aarch64-linux-gnu/nvidia /usr/lib/aarch64-linux-gnu/tegra 2>&1 | head -40 || true
    - ls -l /dev/nv* /dev/v4l2-* 2>&1 | head -30 || true
    - |
      if command -v readelf >/dev/null; then
        readelf -d build/test_api build/libnvmpi.so* | grep -Ei 'rpath|runpath|needed' || true
      else
        echo "readelf not available"
      fi
    # The runtime injects the REAL libs under .../nvidia (JP6); the build tree
    # carries stubs/ in its RUNPATH. LD_LIBRARY_PATH beats DT_RUNPATH, so put
    # the real dirs first. DT_RPATH would beat LD_LIBRARY_PATH: in that case
    # preload the real libs (a loaded soname satisfies NEEDED regardless).
    - export LD_LIBRARY_PATH="/usr/lib/aarch64-linux-gnu/nvidia:/usr/lib/aarch64-linux-gnu/tegra:${CI_PROJECT_DIR}/build:${LD_LIBRARY_PATH:-}"
    - |
      if command -v readelf >/dev/null && readelf -d build/test_api build/libnvmpi.so* | grep -q '(RPATH)'; then
        echo "DT_RPATH found: preloading real tegra libs"
        pre=""
        for d in /usr/lib/aarch64-linux-gnu/nvidia /usr/lib/aarch64-linux-gnu/tegra; do
          for l in libnvv4l2.so libnvbufsurface.so.1.0.0 libnvbufsurftransform.so.1.0.0; do
            [ -e "$d/$l" ] && pre="$pre:$d/$l"
          done
        done
        export LD_PRELOAD="${pre#:}"
        echo "LD_PRELOAD=$LD_PRELOAD"
      fi
    - ldd build/test_api || true
    - ./build/test_api

# ---------------------------------------------------------------------------
# Stage: release-test — the release gate. Same job as test:api:hw (extends,
# no script copy) but tag pipelines only, HW_TIER=full soak, real hardware
# only (the mock is additive and not part of the gate). Timeout: a default-
# depth run takes ~25s (typically 22-28s, one 74s outlier, MR/push pipelines
# 2026-10); the loops scale linearly with NVMPI_TEST_ITER, so 50 iterations
# (10x decoder, 5x encoder) is roughly 5 min at worst; 30m leaves wide
# margin; no weekly soak run exists yet to measure. dist:jp6/dist:jp5 need
# this job (non-optional) on tags, so a failure stops dist -> upload:s3 ->
# release.
# ---------------------------------------------------------------------------
release:test:api:hw:
  extends: test:api:hw
  stage: release-test
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  timeout: 30m
  variables:
    HW_TIER: "full"
    NVMPI_TEST_ITER: "50"
    NVMPI_TEST_STRICT: "1"

# ---------------------------------------------------------------------------
# Stage: test (stub / sanitizers) — libnvmpi against the behavioural Jetson
# mock (mock/, issues #98-#100). ADDITIVE ONLY: plain container (builder
# image, NO tags, NO Tegra runtime, no Jetson hardware); never replaces or
# gates test:api:hw, which keeps running every suite on the Orin. Hardware
# stays the source of truth for driver behaviour; these jobs catch logic,
# lifecycle and memory/thread bugs early and cheaply. They start with
# needs: [] (they build their own mock tree), so they run in parallel with
# build and the hw job; a failure cancels the queued hw job
# (workflow:auto_cancel).
#
#   test:api:stub:jp6/jp5  plain Release build, JetPack 6 and 5 builder
#                          images (header sets differ per JetPack)
#   test:api:asan          ASan + UBSan + LSan build (jp6)
#   test:api:tsan          TSan build (jp6)
#
# The mock libs carry the real sonames and are found through LD_LIBRARY_PATH
# only (the build tree has no RPATH/RUNPATH in mock mode); the job asserts
# that, then prints how the three Jetson sonames resolve, then runs ctest:
#   mock_selftest  the mock libs on their own (queue state machine, blocking
#                  wake-ups, NvBufSurface strict FromFd, transform, decoder
#                  and encoder models, fault/delay injection)
#   api_mock       test/api/test_api against the mock (create/close paths)
#   api_mock_dec   libnvmpi decoder against the mock decoder model (#99):
#                  N-packet decode, resolution change, teardown, flush and a
#                  fault-injection matrix (NVMPI_MOCK_FAULT), each case in a
#                  forked child under alarm()
#   api_mock_enc   libnvmpi encoder against the mock encoder model (#100):
#                  blocking and non-blocking (EAGAIN) encode, key frame/IDR
#                  and SPS/PPS placement, flush, teardown with frames in
#                  flight, DMABUF input, and the same fault matrix
#
# Forked test children leave through _exit(), which skips LeakSanitizer's
# atexit check; test/api/leak_check.h runs the check explicitly first, so
# ASan reports leaks per case without valgrind or a SANITIZER-specific exit.
# ---------------------------------------------------------------------------
.test-api-mock:
  stage: test
  # Not on tags: the release gate is hardware only (release:test:api:hw).
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        paths: *code-paths
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - when: on_success
  needs: []
  timeout: 20m
  variables:
    NVMPI_TEST_VERBOSE: "1"
    NVMPI_SANITIZER: ""
    BUILD_TYPE: "Release"
  before_script: []
  script:
    - |
      cmake -S . -B build-mock -DNVMPI_MOCK=ON -DBUILD_TESTING=ON \
        -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" -DNVMPI_SANITIZER="${NVMPI_SANITIZER}"
    - cmake --build build-mock -j"$(nproc)"
    - ls -l build-mock/mock
    # libnvmpi probes the codec device nodes before creating a codec.
    - bash ./scripts/mock-dev-nodes.sh
    # RPATH would beat LD_LIBRARY_PATH and could pull stubs/ in front of the
    # mock; RUNPATH/none cannot. Fail loudly if one sneaks in.
    - |
      for f in build-mock/test_api build-mock/test_api_dec_mock build-mock/test_api_enc_mock \
               build-mock/libnvmpi.so build-mock/mock/test_mock; do
        [ -f "$f" ] || { echo "missing $f"; exit 1; }
        dyn="$(readelf -d "$f")"
        printf '%s\n' "$dyn" | grep -Ei 'rpath|runpath|needed' || true
        if printf '%s\n' "$dyn" | grep -q '(RPATH)'; then echo "DT_RPATH in $f: would shadow the mock"; exit 1; fi
      done
    - export LD_LIBRARY_PATH="${CI_PROJECT_DIR}/build-mock/mock:${CI_PROJECT_DIR}/build-mock:${CI_PROJECT_DIR}/stubs"
    # Proof the mock (not the stubs) is what test_api loads.
    - ldd build-mock/test_api | tee /tmp/ldd.txt
    - |
      for l in v4l2.so libnvbufsurface.so.1.0.0 libnvbufsurftransform.so.1.0.0; do
        grep -F "$l" /tmp/ldd.txt | grep -q "${CI_PROJECT_DIR}/build-mock/mock/" \
          || { echo "$l does not resolve to build-mock/mock"; exit 1; }
      done
    - (cd build-mock && ${CTEST_LAUNCHER:-} ctest --output-on-failure -V)
  artifacts:
    when: on_failure
    paths:
      - build-mock/Testing/Temporary/LastTest.log
    expire_in: 1 week

test:api:stub:jp6:
  extends: .test-api-mock

test:api:stub:jp5:
  extends: .test-api-mock
  image:
    name: "${BUILDER_IMAGE_JP5}"
    pull_policy: if-not-present

test:api:asan:
  extends: .test-api-mock
  variables:
    NVMPI_SANITIZER: "address"
    BUILD_TYPE: "Debug"
    ASAN_OPTIONS: "detect_leaks=1:strict_string_checks=1:abort_on_error=0"
    UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"

test:api:tsan:
  extends: .test-api-mock
  variables:
    NVMPI_SANITIZER: "thread"
    BUILD_TYPE: "Debug"
    TSAN_OPTIONS: "halt_on_error=1:second_deadlock_stack=1:suppressions=${CI_PROJECT_DIR}/test/tsan.supp"
    # TSan aborts at startup with "unexpected memory mapping" when the host
    # kernel randomises mmap with more bits than the shadow layout supports
    # (vm.mmap_rnd_bits=32). Run ctest (and so every child) without ASLR.
    CTEST_LAUNCHER: "setarch -R"

# ---------------------------------------------------------------------------
# Stage: dist — build REAL libnvmpi and package it (tags: gated release
# version; default branch: <ver>-<short-sha> snapshot). The
# stub builds above are NOT runnable. Plain container build on any arm64
# runner; no Jetson hardware needed. --no-stubs hard-fails if the real libs
# are missing, so a release can never ship a stub-linked tarball.
# Produces dist/jetson-nvmpi_<ver>_l4t<tag>_aarch64.tar.gz plus the debs
# dist/libnvmpi1_<debver>_arm64.deb and libnvmpi-dev_<debver>_arm64.deb
# (tags: <ver>-1~jpN, main: <ver>~<count>.<sha>-1~jpN) (artifacts: 1 week).
# ---------------------------------------------------------------------------
# Paths that change a deb/tarball. MR pipelines run dist + test:deb only when
# one of them changed; tags and main always run them.
.pkg-paths: &pkg-paths
  - scripts/package*.sh
  - scripts/test-deb.sh
  - packaging/**/*
  - CMakeLists.txt
  - nvmpi.pc.in
  - .gitlab-ci.yml

.dist:
  stage: dist
  <<: *tag-or-main
  variables:
    JP: "6"
    GIT_DEPTH: "0"   # full history + tags: snapshot commit count
  before_script: *real-libs
  script:
    - PFX="${CI_PROJECT_DIR}/_pkg"
    - CMAKE_VERSION="$(sed -n 's/^project(nvmpi VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt)"
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        # Release gate: the tag must match the project VERSION in CMakeLists.txt.
        VERSION="${CI_COMMIT_TAG#v}"
        test "${CMAKE_VERSION}" = "${VERSION}" || { echo "tag ${CI_COMMIT_TAG} != CMakeLists.txt VERSION ${CMAKE_VERSION}"; exit 1; }
        DEB_VERSION="${VERSION}-1~jp${JP}"
      else
        # Main snapshot: no gate; build metadata marks it as a snapshot.
        VERSION="${CMAKE_VERSION}-${CI_COMMIT_SHORT_SHA}"
        # Deb snapshot <ver><sep><count>.<sha>: count = commits since the last
        # tag, so snapshots sort in commit order. '~' sorts below the upcoming
        # release; once v<ver> is tagged (VERSION not bumped yet) use '+' so
        # post-release snapshots sort above it.
        git config --global --add safe.directory "${CI_PROJECT_DIR}"
        git fetch --tags --force --quiet
        COUNT="$(git rev-list --count "$(git describe --tags --abbrev=0)..HEAD")"
        SEP="~"; git rev-parse -q --verify "refs/tags/v${CMAKE_VERSION}" >/dev/null && SEP="+"
        DEB_VERSION="${CMAKE_VERSION}${SEP}${COUNT}.${CI_COMMIT_SHORT_SHA}-1~jp${JP}"
      fi
      echo "[i] package version ${VERSION}, deb version ${DEB_VERSION}"
    - bash ./scripts/build.sh --no-stubs --clean --install --prefix "${PFX}" -j"$(nproc)"
    - test -f "${PFX}/lib/libnvmpi.so"
    - >-
      bash ./scripts/package.sh --prefix "${PFX}" --version "${VERSION}"
      --l4t "${L4T_TAG}" --outdir "${CI_PROJECT_DIR}/dist"
    # .deb packages (libnvmpi1 + libnvmpi-dev): dedicated /usr-prefix build, then
    # dpkg-deb -I/-c print + content checks (inside package-deb.sh) -> dist/*.deb
    - bash ./scripts/package-deb.sh --version "${DEB_VERSION}" --jp "${JP}" --outdir "${CI_PROJECT_DIR}/dist" -j"$(nproc)"
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

# needs per rule: tags REQUIRE the release hw gate (a failed gate blocks the
# job, so nothing downstream releases); main snapshots keep the optional need.
dist:jp6:
  extends: .dist
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      needs:
        - "release:test:api:hw"
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event"'
      needs:
        - job: test:api:hw
          optional: true
    # MR: packaging changes only; no hw gate (test:api:hw runs beside it).
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        paths: *pkg-paths
      needs: []

dist:jp5:
  extends: .dist
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      needs:
        - "build:jp5"
        - "release:test:api:hw"
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event"'
      needs:
        - "build:jp5"
        - job: test:api:hw
          optional: true
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        paths: *pkg-paths
      needs: []
  image:
    name: "${BUILDER_IMAGE_JP5}"
    pull_policy: if-not-present
  variables:
    JP: "5"
    L4T_TAG: "${L4T_TAG_JP5}"
    L4T_SOC: "t194"

# ---------------------------------------------------------------------------
# Stage: test-deb — install the debs built by dist:* on a CLEAN system
# (plain ubuntu + NVIDIA apt repo, NOT the builder image, which already has
# every library) and check they load and link: dependency resolution, ldconfig,
# dlopen (JP6) / static symbol check (JP5: NVIDIA r35.4 libs abort without
# /dev/nvmap), libnvmpi-dev compile+link, purge leaves nothing, lintian errors.
# See scripts/test-deb.sh (#112 was a missing libjpeg dependency this catches).
# upload:s3, release:gitlab and release:github need both jobs, so a broken deb
# means no release. Untagged (any K3s runner), no hardware.
# ---------------------------------------------------------------------------
.test-deb:
  stage: test-deb
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        paths: *pkg-paths
  timeout: 20m
  before_script: []
  script:
    - bash ./scripts/test-deb.sh --jp "${JP}" --debdir dist --lintian

test:deb:jp6:
  extends: .test-deb
  needs: ["dist:jp6"]
  image:
    name: "harbor.local/docker.io/library/ubuntu:22.04"
    pull_policy: if-not-present
  variables:
    JP: "6"

test:deb:jp5:
  extends: .test-deb
  needs: ["dist:jp5"]
  image:
    name: "harbor.local/docker.io/library/ubuntu:20.04"
    pull_policy: if-not-present
  variables:
    JP: "5"

# ---------------------------------------------------------------------------
# release:test:deb:hw — tags only: the INSTALLED release debs on the real Orin
# (test:deb:* has no hardware, test:api:hw tests a stub-linked build tree).
# Installs libnvmpi1 + libnvmpi-dev from the dist:jp6 artifacts, builds test_api
# against them via pkg-config only and checks libnvmpi resolves from the system
# path before running it (scripts/test-deb-hw.sh). Extends test:api:hw for the
# image, runner tags, resource_group and env; the default iteration depth
# (~25s) is enough here, the soak is release:test:api:hw. upload:s3,
# release:gitlab and release:github need it (non-optional on tags).
# ---------------------------------------------------------------------------
release:test:deb:hw:
  extends: test:api:hw
  stage: test-deb
  needs: ["dist:jp6"]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  timeout: 10m
  script:
    - bash ./scripts/test-deb-hw.sh --debdir dist

# ---------------------------------------------------------------------------
# Stage: publish — archives (+ changelog on tags) to S3 (NL MinIO) via curl SigV4 (no mc). Runs in
# the release-tools image (built by jetson-ffmpeg). Needs project CI/CD
# variables S3_HOST, S3_ACCESS_KEY, S3_SECRET_KEY, S3_BUCKET.
# Layout: releases/<ver>/jp<N>/ (tags), snapshots/<short-sha>/jp<N>/ (default
# branch, no changelog). NOTES.md (tags only) is passed to release as an
# artifact so git-cliff runs only once.
# ---------------------------------------------------------------------------
.upload-s3:
  stage: publish
  image:
    name: "${RELEASE_IMAGE}"
    pull_policy: if-not-present

# Tags: changelog (NOTES.md artifact for release:gitlab/release:github) +
# upload; also needs the hw deb test.
upload:s3:
  extends: .upload-s3
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  needs: ["dist:jp6", "dist:jp5", "test:deb:jp6", "test:deb:jp5", "release:test:deb:hw"]
  variables:
    GIT_DEPTH: "0"   # full history + tags for git-cliff
  script:
    - curl --version | head -1
    - git fetch --tags --force || true
    - bash ./scripts/changelog.sh
    - bash ./scripts/upload-s3.sh "releases/${CI_COMMIT_TAG#v}" NOTES.md
  artifacts:
    paths:
      - NOTES.md
    expire_in: 1 week

# Default branch: snapshot upload only (no changelog, no artifacts).
upload:s3:snapshot:
  extends: .upload-s3
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event"'
  needs: ["dist:jp6", "dist:jp5", "test:deb:jp6", "test:deb:jp5"]
  script:
    - curl --version | head -1
    - bash ./scripts/upload-s3.sh "snapshots/${CI_COMMIT_SHORT_SHA}"

# ---------------------------------------------------------------------------
# Stage: release — generic package registry + GitLab Release. Tag pipelines
# only, after the S3 upload. Independent of release:github (neither needs the
# other, so one failing does not block the other).
# ---------------------------------------------------------------------------
release:gitlab:
  stage: release
  <<: *only-tag
  image:
    name: "${RELEASE_IMAGE}"
    pull_policy: if-not-present
  needs: ["dist:jp6", "dist:jp5", "test:deb:jp6", "test:deb:jp5", "release:test:deb:hw", "upload:s3"]
  script:
    - bash ./scripts/release.sh

# ---------------------------------------------------------------------------
# release:github — GitHub Release + assets (tarballs, debs, CHANGELOG.md).
# Tag pipelines only. Waits for the push mirror to deliver the tag, then talks
# to the GitHub API with GITHUB_RELEASE_TOKEN (masked CI/CD variable). Needs
# dist artifacts + NOTES.md (upload:s3); independent of release:gitlab.
# ---------------------------------------------------------------------------
release:github:
  stage: release
  <<: *only-tag
  image:
    name: "${RELEASE_IMAGE}"
    pull_policy: if-not-present
  needs: ["dist:jp6", "dist:jp5", "test:deb:jp6", "test:deb:jp5", "release:test:deb:hw", "upload:s3"]
  script:
    - bash ./scripts/release-github.sh

# ---------------------------------------------------------------------------
# Stage: downstream — start the jetson-ffmpeg pipeline with this commit as
# NVMPI_REF. Manual everywhere for now: jetson-ffmpeg does not consume
# NVMPI_REF yet, so an automatic trigger would burn a full Jetson hw run for
# nothing. Keep manual until jetson-ffmpeg consumes NVMPI_REF; then run it
# automatically only on tag and nightly pipelines, with its fast hw tier.
# NVMPI_REF = ref name (branch/tag): jetson-ffmpeg's job token can fetch
# dist:* artifacts by ref (jobs/artifacts/<ref>/download), not by SHA.
# NVMPI_SHA identifies the exact commit (snapshots/<short-sha>/ on S3).
# ---------------------------------------------------------------------------
trigger:jetson-ffmpeg:
  stage: downstream
  allow_failure: true
  variables:
    NVMPI_REF: "${CI_COMMIT_REF_NAME}"
    NVMPI_SHA: "${CI_COMMIT_SHA}"
  trigger:
    project: timmertech/jetson-ffmpeg
    branch: main
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
